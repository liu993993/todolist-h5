<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0ea5a4">
  <title>ToDo List</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="app-kicker">Today</p>
      <h1>ToDo List</h1>
      <p class="app-subtitle">把今天要做的事轻轻放在这里。</p>
    </header>

    <section class="todo-panel" aria-label="待办事项">
      <form class="todo-form" id="todoForm">
        <label class="sr-only" for="todoInput">输入待办事项</label>
        <input
          id="todoInput"
          class="todo-input"
          type="text"
          placeholder="添加一个待办事项"
          autocomplete="off"
        >
        <button class="add-button" type="submit">添加</button>
      </form>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon" aria-hidden="true"></div>
        <p>还没有待办事项</p>
        <span>先写下第一件小事吧。</span>
      </div>

      <ul class="todo-list" id="todoList" aria-live="polite"></ul>
    </section>

    <footer class="todo-footer">
      <span>总计 <strong id="totalCount">0</strong></span>
      <span>已完成 <strong id="doneCount">0</strong></span>
    </footer>
  </main>

  <script src="./script.js"></script>
</body>
</html>
