<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f9f9a">
  <title>H5 学习计划 ToDoList</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="kicker">12 周 H5 学习路线</p>
      <h1>我的学习计划</h1>
      <p class="subtitle">这里已经放好了之前的详细版计划。你可以勾选每天的进度，也可以给每周新增自己的内容和笔记。</p>
    </header>

    <section class="summary" aria-label="学习统计">
      <div class="summary-card">
        <span>总任务</span>
        <strong id="totalTasks">0</strong>
      </div>
      <div class="summary-card">
        <span>已完成</span>
        <strong id="doneTasks">0</strong>
      </div>
      <div class="summary-card">
        <span>进度</span>
        <strong id="progressRate">0%</strong>
      </div>
    </section>

    <section class="toolbar" aria-label="操作区">
      <p>进度和笔记会自动保存在当前浏览器。</p>
      <button class="reset-button" id="resetButton" type="button">重置</button>
    </section>

    <section class="week-tabs-wrap" aria-label="每周切换">
      <div class="week-tabs" id="weekTabs" role="tablist" aria-label="选择学习周"></div>
    </section>

    <section class="week-list" id="weekList" aria-label="每周学习计划"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
